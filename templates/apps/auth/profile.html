{% extends 'apps/base/include.html' %}
{% load static %}

{% block body %}
    <div class="col-12 col-md-12 d-flex justify-content-center">
        <div class="bg-white dark__bg-1100 p-4 text-center rounded-3 shadow-lg w-100">
            <img class="img-thumbnail img-fluid rounded-circle mb-3 shadow-sm border border-2"
                 src="{% static 'app/assets/css/profile.png' %}"
                 alt="User Profile" width="120">

            <h5 class="mb-1 fw-bold text-primary">
                {{ user.phone_number }}
            </h5>

            <p class="fs--2 mb-2">
                <a class="btn btn-outline-primary px-4 py-1 rounded-pill fw-semibold" href="{% url 'settings' %}">
                    <i class="fas fa-cog me-1"></i> Settings
                </a>
            </p>
        </div>
    </div>
{% endblock %}
