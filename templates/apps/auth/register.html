{% extends "apps/base/include.html" %}

{% load static %}

{% block head %}
    <link rel="stylesheet" href="{% static 'app/assets/css/user.css' %}">
    <style>
        body {
            background: url('{% static "app/assets/images/bg.jpg" %}') no-repeat center center fixed;
            background-size: cover;
        }

        .content_auth_form {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            backdrop-filter: blur(10px);
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
            padding: 25px;
            width: 380px;
            color: white;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-control {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            transform: scale(1.07);
            box-shadow: 0 0 20px rgba(221, 36, 118, 0.6);
        }

        a {
            color: #ff512f;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #dd2476;
        }

        .logo-text {
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
        }

    </style>
{% endblock %}

{% block body %}
    <div class="content_auth_form">
        <div class="content_auth_form_group">
            <div class="content_auth_form_group_input">
                <div class="card">
                    <form method="post">
                        {% csrf_token %}
                        <div class="card-header text-center p-2">
                            <a class="font-sans-serif fw-bolder fs-4 logo-text" href="/">
                                🔥 Alijahon
                            </a>
                        </div>

                        {% if messages %}
                            {% for message in messages %}
                                <h3 style="color:red">{{ message }}</h3>
                            {% endfor %}
                        {% endif %}

                        <div class="card-body p-4">
                            <h3 class="text-center">✨ Sign up</h3>

                            <div class="mb-3">
                                <label class="form-label">📱 Phone number</label>
                                <input type="text" name="phone_number" class="form-control" placeholder="+998XX XXX-XX-XX">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">🔒 Password</label>
                                <input type="password" name="password1" class="form-control" placeholder="********">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">🔑 Confirm password</label>
                                <input type="password" name="password2" class="form-control" placeholder="********">
                            </div>

                            <div class="mb-3">
                                <button class="btn btn-primary d-block w-100 mt-3" type="submit">
                                    🚀 Sign up
                                </button>
                            </div>

                            <p class="text-center">
                                🔄 Have an account?? <a href="{% url 'auth' %}">Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
